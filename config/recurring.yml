production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  clear_stale_oauth:
    command: "OauthGrant.stale.includes(:session).find_each(&:disconnect!); OauthClient.unclaimed.destroy_all"
    schedule: every day at 3:40
