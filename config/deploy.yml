service: mcc-choices
image: fazzledev/mcc-choices
retain_containers: 2

servers:
  web:
    - 116.203.147.239

proxy:
  ssl: true
  hosts:
    - neet-pg-choice-planner.fazzle.dev
    - neet-pg-choices.fazzle.dev
    - mcc.fazzle.dev
  app_port: 3000

registry:
  server: ghcr.io
  username: fazzledev
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    SOLID_QUEUE_IN_PUMA: true
    APP_HOST: neet-pg-choice-planner.fazzle.dev
    SMTP_ADDRESS: smtp-relay.brevo.com
    SMTP_USER_NAME: a5471d001@smtp-brevo.com
    SMTP_FROM: NEET PG Choice Planner <hey@fazzle.dev>
    SMTP_DOMAIN: fazzle.dev
    GOATCOUNTER_URL: https://stats.fazzle.dev

aliases:
  litestream-logs: accessory logs litestream -f
  litestream-status: accessory exec litestream "litestream databases"
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
  stats-logs: accessory logs goatcounter -f
  stats-create-site: accessory exec goatcounter --interactive --reuse "goatcounter db create site -vhost=stats.fazzle.dev -user.email=hey@fazzle.dev"

volumes:
  - "mcc_choices_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64
  remote: ssh://root@116.203.147.239
  local: false

deploy_timeout: 120
drain_timeout: 60

accessories:
  litestream:
    image: litestream/litestream:0.5.6
    role: web
    cmd: replicate
    env:
      secret:
        - S3_ACCESS_KEY_ID
        - S3_SECRET_ACCESS_KEY
    files:
      - config/litestreams/production.yml:/etc/litestream.yml
    volumes:
      - "mcc_choices_storage:/rails/storage"
      - "goatcounter_data:/goatcounter-data"
  goatcounter:
    image: arp242/goatcounter:2.7.0
    role: web
    volumes:
      - "goatcounter_data:/home/goatcounter/goatcounter-data"
    proxy:
      host: stats.fazzle.dev
      ssl: true
      app_port: 8080
      healthcheck:
        path: /status
