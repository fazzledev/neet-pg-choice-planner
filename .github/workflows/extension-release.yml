name: Extension release

on:
  push:
    tags: ["extension-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the manifest version
        run: |
          manifest_version=$(jq -r .version extension/manifest.json)
          tag_version="${GITHUB_REF_NAME#extension-v}"
          [ "$tag_version" = "$manifest_version" ] || { echo "::error::Tag $tag_version does not match manifest version $manifest_version"; exit 1; }

      - name: Build the package
        run: bin/build-extension "choice-planner-filler-${GITHUB_REF_NAME#extension-v}.zip"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#extension-v}"
          sha256sum "choice-planner-filler-$version.zip" > "choice-planner-filler-$version.sha256"
          gh release create "$GITHUB_REF_NAME" "choice-planner-filler-$version.zip" "choice-planner-filler-$version.sha256" \
            --title "Extension $version" \
            --notes "The exact package uploaded to the Chrome Web Store and Firefox Add-ons for this version, built from this tag's extension/ folder."
